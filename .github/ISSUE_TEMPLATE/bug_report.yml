name: Bug report
description: Something on the site, a preview, or a download pack is broken
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the page ...\n2. Click ...\n3. ..."
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL or template slug
  - type: input
    id: env
    attributes:
      label: Browser and OS
      placeholder: Chrome 130 on Windows 11
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors
