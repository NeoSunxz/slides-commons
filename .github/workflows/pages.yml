# Deploy the site to GitHub Pages from main.
# Requires (once): Settings -> Pages -> Source = "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# contents: read  - check out the repo
# pages: write    - publish the Pages deployment
# id-token: write - OIDC token that actions/deploy-pages uses to prove the deployment's origin
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out (with upstream submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Public base URL of the project page, e.g. https://neosunxz.github.io/slides-commons/.
      # The build writes <url>zip/<slug>.zip into the prompts so agents can fetch the pack.
      # (A custom domain would need this changed.)
      - name: Compute site URL
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          url="https://${OWNER}.github.io/${REPO}/"
          url="${url,,}"
          echo "SC_SITE_URL=${url}" >> "$GITHUB_ENV"
          echo "Site URL: ${url}"

      - name: Validate templates and translations
        run: npm run validate

      - name: Build site/
        run: npm run build

      # Fail early on an incomplete or Pages-unfriendly build.
      - name: Sanity-check site/
        run: |
          set -eu
          for f in site/index.html site/zh/index.html site/.nojekyll; do
            [ -e "$f" ] || { echo "missing: $f"; exit 1; }
          done
          zips=$(find site/zip -maxdepth 1 -name '*.zip' | wc -l)
          [ "$zips" -eq 34 ] || { echo "expected 34 zips in site/zip, found $zips"; exit 1; }
          big=$(find site -type f -size +25M)
          [ -z "$big" ] || { echo "files over 25 MB:"; echo "$big"; exit 1; }
          grep -q "${SC_SITE_URL}zip/" site/zh/t/*/index.html >/dev/null || { echo "prompts do not contain ${SC_SITE_URL}zip/"; exit 1; }
          echo "site/ ok: $(find site -type f | wc -l) files, $(du -sh site | cut -f1)"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
