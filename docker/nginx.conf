# nginx for the slides-commons image: static files from /srv/www/site, runs as the unprivileged "nginx" user; __PORT__ is replaced at start (env PORT, default 80).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Not in older mime.types files; the site ships .mjs (the CJK embed script in packs).
  types {
    text/javascript mjs;
  }

  access_log /dev/stdout;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;

  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  # Text compresses well; woff2, png and zip are already compressed.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/xml;

  server {
    listen __PORT__ default_server;
    listen [::]:__PORT__ default_server;
    server_name _;
    root /srv/www/site;
    index index.html;
    add_header X-Content-Type-Options nosniff always;

    # Only reachable once the build has finished (nginx starts after it): used by the healthcheck.
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # Pages are revalidated every time (ETag), so a rebuilt site shows up at once.
    location ~* \.(html|json)$ { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; try_files $uri =404; }

    # File names are not content-hashed: cache for an hour, then revalidate.
    location ~* \.(css|js|mjs|woff2|png|jpg|webp|svg|zip|txt)$ {
      add_header Cache-Control "public, max-age=3600";
      add_header X-Content-Type-Options nosniff always;
      try_files $uri =404;
    }

    location / {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ =404;
    }
  }
}
